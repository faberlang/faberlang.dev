# Sidebar nav labels exactly as nav.fab emits them. inject-chrome.py replaces
# these strings inside <aside>; a label must be declared here even when no
# locale translates it, or a shorter translated label can be substituted
# inside it. Labels covered by the sections above (Overview, Examples,
# Releases, All releases, the agent items) are not repeated.
