# Fallbacks the site build accepts, each with the reason it is accepted.
#
# The build records every fallback it takes (a fence that will not convert, a
# slug collision, an uncached diagram). It fails on any that is not listed here,
# and fails on a listed entry that no longer matches anything, so this file only
# ever holds things that are true today. `subject` is an fnmatch pattern.

[[allow]]
kind = "corpus-slug-collision"
subject = "textus"
why = "the pack gives `textus` and `string` the same English slug; the first term in sorted order keeps it and `textus` stays on its identity key, by design"

[[allow]]
kind = "corpus-slug-collision"
subject = "varia"
why = "the 1.14 English pack spells both the binding word `varia` and the parameter and call marker `in` as `mut`; the first term in sorted order (`in`) keeps the slug /corpus/mut.html and `varia` stays on its identity key /corpus/varia.html. A reader who searches for the binding `mut` lands on the marker page. Known wrinkle, not a design goal"

[[allow]]
kind = "corpus-slug-collision"
subject = "intervallum"
why = "from 1.15 the English pack spells both the range-loop keyword `ab` (`for range 0‥5 let i`) and the range type `intervallum` as `range`; the first term in sorted order (`ab`) keeps the slug /corpus/range.html and `intervallum` stays on its identity key /corpus/intervallum.html. Same wrinkle as `varia` and `in`"

