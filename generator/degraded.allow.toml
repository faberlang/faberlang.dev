# Fallbacks the site build accepts, each with the reason it is accepted.
#
# The build records every fallback it takes (a fence that will not convert, a
# slug collision, an uncached diagram). It fails on any that is not listed here,
# and fails on a listed entry that no longer matches anything, so this file only
# ever holds things that are true today. `subject` is an fnmatch pattern.

[[allow]]
kind = "corpus-slug-collision"
subject = "textus"
why = "the pack gives `textus` and `string` the same English slug; the first term in sorted order keeps it and `textus` stays on its identity key, by design"

[[allow]]
kind = "corpus-convert"
subject = "radix/corpus/ad/sermo-close.fab"
why = "this canonical exemplar fails `faber convert` (unknown type name), so its source is projected token-wise; the defect is in the radix corpus record"

[[allow]]
kind = "transcode"
subject = "cheatsheet/imports.md"
why = "one fence is an import fragment with no inferable name; the page shows its source unchanged"

[[allow]]
kind = "transcode"
subject = "language/capabilities.md"
why = "five fences are partial snippets (unknown types, bare statements) that `faber convert` rejects; the page shows their source unchanged"

[[allow]]
kind = "transcode"
subject = "language/errors.md"
why = "two fences reference identifiers they do not declare; the page shows their source unchanged"

[[allow]]
kind = "transcode"
subject = "language/reader-locales.md"
why = "five fences show other locales' own spellings, which cannot be read as Latin source; the page shows them unchanged"

[[allow]]
kind = "transcode"
subject = "releases/radix-0.78.0.md"
why = "a generated release-notes fence carries an inline comment the lexer refuses (LEX007); the page shows its source unchanged"

